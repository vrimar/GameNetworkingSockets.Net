name: build-native

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    paths:
      - 'external/GameNetworkingSockets/**'
      - 'build/**'
      - '.github/workflows/build-native.yml'
  push:
    branches: [main]
    paths:
      - 'external/GameNetworkingSockets/**'
      - 'build/**'
      - '.github/workflows/build-native.yml'

permissions:
  contents: read

concurrency:
  group: build-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.rid }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            runner: windows-2022
            script: pwsh build/build-native-win.ps1
          - rid: linux-x64
            runner: ubuntu-22.04
            script: bash build/build-native-unix.sh linux-x64
          - rid: osx-arm64
            runner: macos-14
            script: bash build/build-native-unix.sh osx-arm64

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up CMake
        uses: lukka/get-cmake@latest

      - name: Set up MSVC (Windows)
        if: matrix.rid == 'win-x64'
        uses: microsoft/setup-msbuild@v2

      - name: Restore vcpkg binary cache (Windows)
        if: matrix.rid == 'win-x64'
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.vcpkg-binary-cache
          key: vcpkg-${{ runner.os }}-${{ hashFiles('external/GameNetworkingSockets/vcpkg.json', 'build/triplets/**') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-

      - name: Prepare vcpkg binary cache (Windows)
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: New-Item -ItemType Directory -Force '${{ github.workspace }}/.vcpkg-binary-cache' | Out-Null

      - name: Install Linux dependencies
        if: matrix.rid == 'linux-x64'
        run: |
          sudo apt-get update
          sudo apt-get install -y perl

      - name: Build native library (${{ matrix.rid }})
        shell: bash
        env:
          VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/.vcpkg-binary-cache,readwrite
        run: ${{ matrix.script }}

      - name: Set up .NET (Unix smoke test)
        if: runner.os != 'Windows'
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Run native smoke tests (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          dotnet build tests/GameNetworkingSockets.Net.Tests/GameNetworkingSockets.Net.Tests.csproj -c Release
          output=tests/GameNetworkingSockets.Net.Tests/bin/Release/net10.0
          case "${{ matrix.rid }}" in
            linux-x64)
              cp artifacts/native/linux-x64/libGameNetworkingSockets.so "$output/"
              ;;
            osx-arm64)
              cp artifacts/native/osx-arm64/libGameNetworkingSockets.dylib "$output/"
              ;;
          esac
          dotnet test tests/GameNetworkingSockets.Net.Tests/GameNetworkingSockets.Net.Tests.csproj -c Release --no-build

      - name: Upload GameNetworkingSockets shared library
        uses: actions/upload-artifact@v4
        with:
          name: gns-native-${{ matrix.rid }}
          path: artifacts/native/${{ matrix.rid }}/
          if-no-files-found: error
          retention-days: 14
