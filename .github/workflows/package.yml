name: package

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version (e.g., 1.0.0)'
        required: true
        type: string
      publish:
        description: 'Push to NuGet.org'
        required: true
        type: boolean
        default: false
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-native:
    uses: ./.github/workflows/build-native.yml
    with:
      fresh: true

  pack:
    name: dotnet pack
    needs: build-native
    runs-on: ubuntu-22.04
    permissions:
      contents: read

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Download all native artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: gns-native-*
          path: artifacts/native/
          merge-multiple: false

      - name: Reshape artifact layout
        run: |
          set -euo pipefail
          for src in artifacts/native/gns-native-*; do
              rid="${src#artifacts/native/gns-native-}"
              mv "$src" "artifacts/native/$rid"
          done
          find artifacts -type f

      - name: Determine package version
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "value=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "value=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=0.0.0-ci.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and pack
        run: |
          dotnet build GameNetworkingSockets.Net.sln -c Release -p:Version=${{ steps.version.outputs.value }} -p:SkipNativeWarning=true
          dotnet pack src/GameNetworkingSockets.Net/GameNetworkingSockets.Net.csproj -c Release -p:Version=${{ steps.version.outputs.value }} -o packages
          dotnet pack src/GameNetworkingSockets.Net.Certificates/GameNetworkingSockets.Net.Certificates.csproj -c Release -p:Version=${{ steps.version.outputs.value }} -o packages

      - name: Upload nupkgs
        uses: actions/upload-artifact@v4
        with:
          name: nupkgs
          path: packages/

  publish:
    name: dotnet nuget push
    needs: pack
    if: ${{ (inputs.publish == true) || startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-22.04
    permissions:
      id-token: write

    steps:
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Download nupkgs
        uses: actions/download-artifact@v4
        with:
          name: nupkgs
          path: packages/

      - name: Log in to NuGet.org
        id: login
        uses: NuGet/login@v1
        with:
          user: vrimar

      - name: Publish to NuGet.org
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          dotnet nuget push 'packages/*.nupkg' --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY" --skip-duplicate
          dotnet nuget push 'packages/*.snupkg' --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY" --skip-duplicate
