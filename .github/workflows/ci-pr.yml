name: ci-pr

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  managed:
    name: Build and test managed code
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build solution
        run: dotnet build GameNetworkingSockets.Net.sln -c Release -p:SkipNativeWarning=true

      - name: Run smoke tests (no native lib loaded)
        run: dotnet test tests/GameNetworkingSockets.Net.Tests/GameNetworkingSockets.Net.Tests.csproj -c Release --no-build
